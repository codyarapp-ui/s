<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Glowing background effect behind logo -->
  <circle cx="260" cy="315" r="180" fill="#2563eb" opacity="0.25" filter="blur(60px)"/>

  <!-- Logo emblem -->
  <g transform="translate(180, 235)">
    <rect width="160" height="160" rx="36" fill="url(#primaryGrad)"/>
    <g transform="translate(80, 80) scale(0.65)">
      <circle cx="0" cy="0" r="85" fill="none" stroke="#ffffff" stroke-width="22"/>
      <path d="M-40 0 L40 0 M0 -40 L0 40" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="30" fill="#ffffff"/>
    </g>
  </g>

  <!-- Text Section (Right-to-Left aligned for Persian) -->
  <g fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">
    <!-- Main Title -->
    <text x="820" y="270" text-anchor="middle" font-size="64" font-weight="900" fill="#60a5fa">کدیار۲۴</text>
    <text x="750" y="340" text-anchor="middle" font-size="36" font-weight="800" fill="#ffffff">سامانه هوشمند عیب‌یابی کدهای خطا</text>
    <text x="750" y="395" text-anchor="middle" font-size="24" font-weight="500" fill="#94a3b8">مرجع تخصصی کدهای ارور، قطعات یدکی اورجینال و خدمات تعمیرات</text>
  </g>

  <!-- Badge / URL at bottom -->
  <g transform="translate(600, 480)">
    <rect x="-180" y="-24" width="360" height="48" rx="24" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#93c5fd">https://kodyar24.ir</text>
  </g>
</svg>
